# SPDX-License-Identifier: MPL-2.0
#
# Cerro Torre manifest for first-post .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "first-post"
version = "0.1.0"
revision = 1
summary = "A self-contained browser idle game about learning snail mail: write letters, buy stamps and route mail across modeled postal networks; no build or dependencies."
description = """
first-post — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "{{LICENSE}}"
homepage = "https://github.com/metadatastician/first-post"
maintainer = "{{AUTHOR}} <{{EMAIL}}>"

[provenance]
upstream = "https://github.com/metadatastician/first-post"
import_date = 2026-11-27T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "{{PORT}}"

[outputs]
primary = "first-post"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [{{PORT}}]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
